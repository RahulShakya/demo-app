apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hybrid-saas-ingress
  namespace: hybrid-saas
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hybrid-saas-web
                port:
                  number: 80
